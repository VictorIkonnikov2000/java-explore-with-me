version: "3.8"
services:
  stats-server:
    build:
      context: ./stats-service/stats-server
      dockerfile: Dockerfile # Укоротили путь, т.к. Dockerfile теперь в context
    container_name: stats-server
    depends_on:
      - stats-db
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "6542:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
  ewm-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile # Укоротили путь, т.к. Dockerfile теперь в context
    container_name: ewm-server
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - stats-server # Добавлена зависимость от stats-server

